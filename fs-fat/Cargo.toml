[package]
workspace = ".."
name = "hyper-fs-fat"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
autotests = false
[[bin]]
name = "hyper-fs-fat"
path = "src/main.rs"
test = false
bench = false
[dependencies]
hyper-os = { workspace = true, features = ["std"] }
hyper-rt.workspace = true
hyper-filesystem.workspace = true
fatfs = { path = "../../../third_party/rust-fatfs", default-features = false, features = ["lfn", "unicode"] }

[lints]
workspace = true

[features]
block-queue-test = []
