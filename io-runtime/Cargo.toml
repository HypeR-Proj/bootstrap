[package]
name = "hyper-io-runtime"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/HypeR-Proj/bootstrap"
publish = false
autotests = false

[[bin]]
name = "hyper-io-runtime"
path = "src/main.rs"
test = false
bench = false

[[bin]]
name = "hyper-storage-probe"
path = "tests/fixtures/storage_probe.rs"
required-features = [
    "storage-probe",
]
test = false
bench = false

[features]
storage-probe = []
broker-test = []
userspace-device-test = []
physical-retirement-probe = []

[dependencies.serde]
version = "1"
features = [
    "derive",
]

[dependencies.serde_json]
version = "1"

[dependencies.hyper-os]
version = "=0.0.0"
features = [
    "std",
]

[dependencies.hyper-rt]
version = "=0.0.0"
features = [
    "std",
]

[dependencies.hyper-abi]
version = "=0.0.0"

[lints.clippy]
doc_markdown = "deny"
empty_docs = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"
missing_safety_doc = "deny"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = [
    "cfg(target_os, values(\"hyper\"))",
]
