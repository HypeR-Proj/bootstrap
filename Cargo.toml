[workspace]
resolver = "3"
members = [
    "console-raw", "fallback-sh", "fs-backend",
    "fs-erofs", "fs-fat", "init", "io-runtime", "mount", "umount",
    "lib/*",
]
exclude = [".cargo", "target", "userspace-loader"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/roolrz/HypeR"
publish = false

[workspace.dependencies]
hyper-abi = "=0.0.0"
hyper-os = "=0.0.0"
hyper-filesystem = "=0.0.0"
hyper-rt = { version = "=0.0.0", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hyper-service-manager = { package = "bootstrap-service-manager", path = "lib/service-manager" }
hyper-service = { package = "bootstrap-service", path = "lib/service" }
hyper-block = { package = "bootstrap-block", path = "lib/block" }
hyper-vm-image = { package = "bootstrap-vm-image", path = "lib/vm-image" }
hyper-fs-service = { package = "bootstrap-fs-service", path = "lib/fs-service" }
hyper-fatfs = { package = "bootstrap-fatfs", path = "lib/fatfs" }
hyper-erofs = { package = "bootstrap-erofs", path = "lib/erofs" }

[workspace.lints.clippy]
doc_markdown = "deny"
empty_docs = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"
missing_safety_doc = "deny"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("hyper"))'] }
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
codegen-units = 1
debug = 1
incremental = false
lto = "fat"
opt-level = "s"
overflow-checks = true
panic = "abort"
strip = "none"
